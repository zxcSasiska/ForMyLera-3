<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вопрос 1</title>
    <link rel="stylesheet" href="css/style2.css">
</head>
<body>

    <div class="question-box">
        <h2>Когда мы начали встречаться?</h2>
        
        <input type="date" id="dateInput" class="date-field">
        
        <button type="button" id="submitBtn" class="submit-btn">Ответить</button>
        
        <p id="message" class="message"></p>
        
        <button type="button" id="nextBtn" class="next-btn">Далее</button>
    </div>

    <!-- Затемнение фона -->
    <div class="overlay" id="overlay"></div>

    <!-- Окно с гифкой -->
    <div class="gif-popup" id="gifPopup">
        <button type="button" class="close-btn" id="closeBtn">✕</button>
        <img id="popupGif" src="" alt="Гифка">
    </div>

    <script src="js/script2.js"></script>
</body>
</html>
